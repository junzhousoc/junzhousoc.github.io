name: Sync Google Sites to GitHub Pages

on:
  schedule:
    # Every two hours, at minute 23, in UTC. GitHub schedules may be delayed.
    - cron: '23 */2 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'sync-config.json'
      - 'requirements.txt'
      - '.github/workflows/sync-google-sites.yml'

permissions:
  contents: read

concurrency:
  group: google-sites-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install -r requirements.txt
      - name: Test conversion safeguards
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch published pages and validate all assets
        id: sync
        run: python scripts/sync.py
      - name: Record monthly synchronization health
        if: ${{ always() }}
        run: python scripts/health.py --outcome "${{ steps.sync.outcome }}"
      - name: Save website content and monthly health history
        if: ${{ always() }}
        run: |
          git add -- .sync
          if [ "${{ steps.sync.outcome }}" = "success" ]; then
            git add -- site
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Sync published content and monthly health record'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete validated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
